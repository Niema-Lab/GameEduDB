name: Compile GameEduDB and deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up environment
        run: |
          sudo apt-get update && \
          sudo apt-get install -y graphviz pandoc python3 python3-pip texlive-xetex && \
          pip install graphviz
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build website
        run: |
          python3 scripts/build_website.py > GameEduDB.html && \
          python3 scripts/build_markdown.py > GameEduDB.md && \
          pandoc -s --toc --metadata title="GameEduDB" -o GameEduDB.pdf --pdf-engine=xelatex GameEduDB.md && \
          mkdir html && \
          cp GameEduDB.html html/index.html && \
          cp GameEduDB.md GameEduDB.pdf html/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './html/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
